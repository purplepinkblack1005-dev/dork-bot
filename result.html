<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dorks generated</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      max-width: 720px;
      margin: 3rem auto;
      padding: 0 1.25rem;
    }
    h1 { font-size: 1.6rem; }
    .box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin: 1rem 0;
    }
    .row { margin: 0.3rem 0; color: #94a3b8; }
    .row strong { color: #e2e8f0; }
    .actions { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1.25rem; }
    a.btn {
      display: inline-block;
      padding: 0.65rem 1.1rem;
      background: #3b82f6;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.95rem;
    }
    a.btn.secondary { background: #475569; }
    a.btn:hover { background: #2563eb; }
    a.btn.secondary:hover { background: #334155; }
    pre {
      background: #020617;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 0.85rem;
      line-height: 1.4;
      max-height: 260px;
    }
    .url-box {
      background: #020617;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-family: ui-monospace, monospace;
      font-size: 0.9rem;
      word-break: break-all;
      color: #38bdf8;
    }
    .copy-hint { font-size: 0.8rem; color: #64748b; margin-top: 0.3rem; }
  </style>
</head>
<body>
  <h1>✅ {{ count }} dorks generated</h1>

  <div class="box">
    <div class="row"><strong>Keywords:</strong> {{ keywords }}</div>
    <div class="row"><strong>Targets:</strong> {{ targets }}</div>
    <div class="row"><strong>Session:</strong> {{ session_id }}</div>
  </div>

  <h3>Raw link</h3>
  <div class="url-box">{{ raw_url }}</div>
  <div class="copy-hint">Open this URL to see plain-text dorks, or share it.</div>

  <div class="actions">
    <a class="btn" href="{{ download_url }}">⬇ Download as .txt</a>
    <a class="btn secondary" href="{{ raw_url }}" target="_blank">View raw</a>
    <a class="btn secondary" href="/">New generation</a>
  </div>

  <h3 style="margin-top:2rem;">Preview (first 15)</h3>
  <pre>{% for d in preview %}{{ d }}
{% endfor %}</pre>
</body>
</html>
